[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "1.0.0"
description = "JARVIS AI Desktop Assistant for Fedora Linux"
authors = [{name = "JARVIS Team"}]
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    # Web / API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",

    # AI / LLM
    "openai>=1.30.0",
    "faster-whisper>=1.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",

    # System / Utilities
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aiofiles>=23.2.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "python-multipart>=0.0.9",

    # Media / Audio
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",

    # System Control
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "Pillow>=10.0.0",
    "screeninfo>=0.8.1",

    # Scheduling / Tasks
    "apscheduler>=3.10.0",
    "python-dateutil>=2.9.0",

    # Config
    "python-dotenv>=1.0.0",
    "toml>=0.10.2",
    "PyYAML>=6.0.0",

    # Notifications
    "plyer>=2.1.0",
]

[project.optional-dependencies]
ui = [
    "PySide6>=6.7.0",
]
voice = [
    "openwakeword>=0.6.0",
    "pyaudio>=0.2.14",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[project.scripts]
jarvis = "jarvis.main:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
