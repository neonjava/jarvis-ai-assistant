version: "3.9"

services:
  jarvis-api:
    build: .
    container_name: jarvis-api
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://jarvis:${POSTGRES_PASSWORD}@db:5432/jarvis
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./plugins/installed:/app/plugins/installed
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - jarvis-net

  db:
    image: postgres:16-alpine
    container_name: jarvis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis_secure_pw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis-net

  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - jarvis-net

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    networks:
      - jarvis-net

volumes:
  postgres_data:
  ollama_data:

networks:
  jarvis-net:
    driver: bridge
